<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page Not Found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<style>
  .notfound {
    min-height: 100vh;
    display: grid; place-items: center;
    text-align: center; padding: 28px;
  }
  .notfound h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(72px, 14vw, 140px);
    margin: 0; color: var(--accent); line-height: 1;
    text-shadow: 0 0 40px oklch(0.78 0.16 220 / 0.35);
  }
  .notfound p {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-3); font-size: 14px; margin: 6px 0;
  }
  .notfound .actions { margin-top: 28px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="root notfound">
  <div>
    <h1>404</h1>
    <p>$ cd /home/page</p>
    <p>bash: cd: /home/page: No such file or directory</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">← Return home</a>
      <a class="btn" href="/projects.html">All projects →</a>
    </div>
  </div>
</div>

</body>
</html>
